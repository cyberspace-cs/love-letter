<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览 C · 樱花粉少女风</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffeef2; --bg2:#ffe0e9; --bg3:#ffd3e0;
  --deep:#a64d6d; --text:#6b4353; --pink:#ff8fab; --hot:#f6658d; --white:#fffdfa; --leaf:#8fbc9f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; overflow:hidden; font-family:"Noto Sans SC","PingFang SC",sans-serif; color:var(--text);
  background:
    radial-gradient(ellipse 70% 50% at 12% 10%, rgba(255,255,255,.75), transparent 55%),
    radial-gradient(ellipse 60% 45% at 88% 85%, rgba(246,101,141,.16), transparent 55%),
    linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
}
/* 云朵感光斑 */
.blob{position:fixed; border-radius:50%; filter:blur(50px); opacity:.55; pointer-events:none}
.blob1{width:320px;height:320px;background:#ffc7d6;top:-90px;left:-70px}
.blob2{width:260px;height:260px;background:#fff3c9;bottom:-60px;right:-40px}
/* 樱花飘落 */
.sakura{position:fixed; top:-6vh; animation:fall linear infinite; user-select:none; opacity:.85}
.sakura:nth-child(1){left:6%; animation-duration:9s; font-size:20px}
.sakura:nth-child(2){left:22%; animation-duration:12s; animation-delay:2s; font-size:14px}
.sakura:nth-child(3){left:44%; animation-duration:10s; animation-delay:1s; font-size:24px}
.sakura:nth-child(4){left:66%; animation-duration:13s; animation-delay:3.5s; font-size:15px}
.sakura:nth-child(5){left:86%; animation-duration:11s; animation-delay:.5s; font-size:19px}
.sakura:nth-child(6){left:33%; animation-duration:14s; animation-delay:6s; font-size:12px}
@keyframes fall{
  0%{transform:translateY(0) rotate(0)} 25%{transform:translate(18px,26vh) rotate(95deg)}
  50%{transform:translate(-14px,52vh) rotate(190deg)} 75%{transform:translate(16px,80vh) rotate(280deg)}
  100%{transform:translateY(110vh) rotate(380deg)}
}
/* 漂浮小爱心 */
.heart{position:fixed; color:rgba(246,101,141,.5); animation:floatUp ease-in-out infinite; user-select:none}
.heart:nth-child(1){left:14%; bottom:12%; font-size:16px; animation-duration:8s}
.heart:nth-child(2){left:58%; bottom:8%; font-size:22px; animation-duration:10s; animation-delay:2.5s}
.heart:nth-child(3){left:82%; bottom:16%; font-size:14px; animation-duration:9s; animation-delay:5s}
@keyframes floatUp{0%{transform:translateY(0); opacity:0} 25%{opacity:.8} 100%{transform:translateY(-46vh); opacity:0}}

.page{max-width:860px; margin:0 auto; padding:7vh 40px; height:100vh; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2}
.badge{display:inline-flex; align-items:center; gap:8px; background:var(--white); border:1.5px dashed var(--pink); color:var(--hot); border-radius:999px; padding:8px 20px; font-family:"Quicksand",sans-serif; font-weight:600; font-size:13px; letter-spacing:.18em; width:fit-content; box-shadow:0 4px 14px rgba(246,101,141,.12)}
h1{font-family:"Ma Shan Zheng","STKaiti",cursive; font-weight:400; font-size:clamp(40px,6vw,68px); color:var(--deep); margin:2.8vh 0 1vh; line-height:1.3}
h1 span{color:var(--hot)}
.card{
  background:rgba(255,253,250,.9); border-radius:26px; padding:38px 42px; max-width:44em;
  box-shadow:0 22px 50px rgba(214,109,140,.18), 0 2px 0 rgba(255,255,255,.9) inset;
  border:1px solid rgba(255,255,255,.8); backdrop-filter:blur(6px);
}
.card .salut{font-family:"Ma Shan Zheng",cursive; font-size:clamp(22px,2.4vw,28px); color:var(--deep); margin-bottom:.8em}
.card p{font-size:clamp(15px,1.4vw,17.5px); line-height:2.05; text-align:justify}
.card p+p{margin-top:.9em}
.card .hl{background:linear-gradient(transparent 62%, rgba(255,143,171,.42) 62%); font-weight:500}
.tape{position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-3deg); width:130px; height:30px; background:rgba(255,196,213,.75); border-radius:3px; box-shadow:0 2px 6px rgba(214,109,140,.18)}
.card-wrap{position:relative; margin-top:1.6vh}
.foot{margin-top:3vh; display:flex; justify-content:space-between; align-items:center}
.foot .sign{font-family:"Ma Shan Zheng",cursive; font-size:26px; color:var(--deep)}
.foot .pill{background:var(--white); border-radius:999px; padding:9px 22px; font-size:13px; letter-spacing:.16em; color:var(--hot); box-shadow:0 4px 14px rgba(246,101,141,.14); font-family:"Quicksand",sans-serif; font-weight:600}
.pop{opacity:0; transform:scale(.92) translateY(14px); animation:pop .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{to{opacity:1; transform:none}}
.p1{animation-delay:.1s}.p2{animation-delay:.3s}.p3{animation-delay:.5s}.p4{animation-delay:.7s}
.wiggle{display:inline-block; animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.12)}}
</style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div>
<div class="sakura">🌸</div><div class="sakura">🌸</div><div class="sakura">🌸</div><div class="sakura">🌸</div><div class="sakura">🌸</div><div class="sakura">🌸</div>
<div class="heart">💗</div><div class="heart">💗</div><div class="heart">💗</div>
<main class="page">
  <div class="badge pop p1">💌 A LOVE LETTER FOR YOU</div>
  <h1 class="pop p2">这就是<span>心动</span>的感觉<span class="wiggle">💗</span></h1>
  <div class="card-wrap pop p3">
    <div class="tape"></div>
    <div class="card">
      <p class="salut">亲爱的宝贝：</p>
      <p>还记得我们一起走过的那条小路吗？两旁是盛开的花朵，空气中弥漫着甜香。你牵着我的手，紧紧的，仿佛怕我会突然消失。我靠在你肩上，感受着你的体温，心里满是甜蜜。</p>
      <p>那些平凡的话语，在那一刻都变得<span class="hl">闪闪发光</span>。我多么希望时间能停留在那一刻，让我永远沉浸在这幸福里。</p>
    </div>
  </div>
  <div class="foot pop p4">
    <span class="sign">—— Tao</span>
    <span class="pill">WITH LOVE · 2026</span>
  </div>
</main>
</body>
</html>
