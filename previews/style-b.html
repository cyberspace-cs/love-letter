<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览 B · 星夜告白风</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#0b1026; --night2:#1a1f42; --night3:#2b2247;
  --moon:#f4ead8; --text:#e9e4f5; --text-soft:#a9a3c9; --rose:#e8a0b4; --glow:rgba(232,160,180,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; overflow:hidden; font-family:"Noto Serif SC","STSong",serif; color:var(--text);
  background:
    radial-gradient(ellipse 60% 45% at 78% 18%, rgba(244,234,216,.14), transparent 60%),
    radial-gradient(ellipse 80% 60% at 20% 100%, rgba(232,160,180,.10), transparent 55%),
    linear-gradient(175deg, var(--night1) 0%, var(--night2) 55%, var(--night3) 100%);
}
/* 星星 */
.stars, .stars2{position:fixed; inset:0; pointer-events:none}
.stars{box-shadow:
  120px 90px 0 1px rgba(255,255,255,.8), 340px 60px 0 0 rgba(255,255,255,.5), 520px 140px 0 1px rgba(255,255,255,.9),
  760px 70px 0 0 rgba(255,255,255,.55), 940px 180px 0 1px rgba(255,255,255,.75), 1120px 90px 0 0 rgba(255,255,255,.5),
  1300px 160px 0 1px rgba(255,255,255,.85), 200px 300px 0 0 rgba(255,255,255,.4), 1450px 260px 0 1px rgba(255,255,255,.6),
  640px 250px 0 0 rgba(255,255,255,.45), 1380px 60px 0 0 rgba(255,255,255,.7), 60px 200px 0 0 rgba(255,255,255,.6);
  width:2px; height:2px; border-radius:50%; animation:twinkle 4.2s ease-in-out infinite alternate}
.stars2{box-shadow:
  420px 380px 0 1px rgba(255,255,255,.5), 880px 320px 0 0 rgba(255,255,255,.65), 1240px 420px 0 1px rgba(255,255,255,.5),
  260px 480px 0 0 rgba(255,255,255,.4), 1050px 520px 0 1px rgba(255,255,255,.55), 1520px 380px 0 0 rgba(255,255,255,.45);
  width:1px; height:1px; border-radius:50%; animation:twinkle 5.6s ease-in-out .8s infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
/* 月亮 */
.moon{position:fixed; top:9vh; right:10vw; width:92px; height:92px; border-radius:50%;
  background:radial-gradient(circle at 36% 34%, #fffaf0, var(--moon) 62%, #d9c9a8);
  box-shadow:0 0 44px 12px rgba(244,234,216,.28), 0 0 120px 40px rgba(244,234,216,.12);}
/* 流萤 */
.firefly{position:fixed; width:5px; height:5px; border-radius:50%; background:var(--rose); box-shadow:0 0 12px 4px var(--glow); opacity:0; animation:drift 12s ease-in-out infinite}
.firefly:nth-child(1){left:16%; bottom:18%; animation-delay:0s}
.firefly:nth-child(2){left:38%; bottom:34%; animation-delay:3.2s}
.firefly:nth-child(3){left:64%; bottom:22%; animation-delay:6.4s}
.firefly:nth-child(4){left:84%; bottom:40%; animation-delay:9s}
@keyframes drift{
  0%{transform:translate(0,0); opacity:0}
  20%{opacity:.9} 50%{transform:translate(46px,-72px); opacity:.7}
  80%{opacity:.9} 100%{transform:translate(-30px,-150px); opacity:0}
}
/* 花瓣 */
.petal{position:fixed; top:-6vh; color:rgba(232,160,180,.55); font-size:14px; animation:fall linear infinite; user-select:none}
.petal:nth-child(1){left:12%; animation-duration:13s}
.petal:nth-child(2){left:47%; animation-duration:16s; animation-delay:4s; font-size:11px}
.petal:nth-child(3){left:78%; animation-duration:14s; animation-delay:2s}
@keyframes fall{to{transform:translateY(110vh) rotate(320deg)}}

.page{max-width:900px; margin:0 auto; padding:9vh 48px; height:100vh; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2}
.kicker{font-family:"Cormorant Garamond",serif; font-style:italic; letter-spacing:.34em; font-size:14px; color:var(--text-soft); display:flex; align-items:center; gap:16px}
.kicker::after{content:""; flex:0 0 72px; height:1px; background:linear-gradient(90deg, var(--rose), transparent)}
h1{font-weight:300; font-size:clamp(36px,5.6vw,64px); letter-spacing:.1em; margin:2.6vh 0 1.2vh; line-height:1.3}
h1 em{font-style:normal; color:var(--rose); text-shadow:0 0 26px var(--glow)}
.letter-card{
  margin-top:3.6vh; padding:40px 44px; border-radius:18px;
  background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  max-width:44em;
}
.letter-card .salut{font-size:clamp(19px,2vw,23px); color:var(--moon); margin-bottom:1em; font-weight:500}
.letter-card p{font-weight:300; font-size:clamp(15px,1.4vw,17.5px); line-height:2.1; color:var(--text); text-align:justify; opacity:0; animation:fadeUp 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.letter-card p:nth-child(2){animation-delay:.5s; margin-bottom:1.1em}
.letter-card p:nth-child(3){animation-delay:1s}
.letter-card .hl{color:var(--rose)}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.foot{margin-top:3.4vh; display:flex; justify-content:space-between; align-items:center; font-family:"Cormorant Garamond",serif; font-style:italic; color:var(--text-soft); letter-spacing:.22em; font-size:13px}
.foot .sign{font-family:"Noto Serif SC",serif; font-style:normal; color:var(--text); letter-spacing:.3em; font-size:15px}
.rise{opacity:0; transform:translateY(16px); animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards}
.r1{animation-delay:.15s}.r2{animation-delay:.35s}
</style>
</head>
<body>
<div class="stars"></div><div class="stars2"></div>
<div class="moon"></div>
<div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div>
<div class="petal">❀</div><div class="petal">❀</div><div class="petal">❀</div>
<main class="page">
  <div class="kicker rise r1">TO MY DEAREST · 星夜递来的信</div>
  <h1 class="rise r2">你是我<em>一束光</em>，闯进平淡的夜</h1>
  <div class="letter-card">
    <p class="salut">亲爱的宝贝：</p>
    <p>此刻，我坐在窗边，阳光透过薄纱洒在纸上，暖暖的，就像你给我的感觉。而你，就像<span class="hl">一束光</span>，突然闯进了我的生活，瞬间点亮了一切。第一次见到你，你站在那里，微微笑着，眼神里满是温柔，那一刻，我的心就乱了节奏。</p>
    <p>我告诉自己，这就是心动的感觉。</p>
  </div>
  <div class="foot">
    <span>UNDER THE SAME STARS · 2026</span>
    <span class="sign">—— Tao</span>
  </div>
</main>
</body>
</html>
