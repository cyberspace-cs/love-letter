<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览 A · 信笺手写风</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe3; --paper-deep:#efe4cf; --ink:#3d2f24; --ink-soft:#6b5744;
  --seal:#b8412f; --gold:#a9822f; --line:rgba(61,47,36,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; overflow:hidden; font-family:"Noto Serif SC","STSong",serif;
  color:var(--ink); position:relative;
  background:
    radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.55), transparent 42%),
    radial-gradient(ellipse at 85% 90%, rgba(169,130,47,.10), transparent 45%),
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(61,47,36,.045) 34px 35px),
    linear-gradient(160deg, var(--paper) 0%, var(--paper-deep) 100%);
}
/* 纸张纤维噪点 */
body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(61,47,36,.05) 1px, transparent 1px); background-size:5px 5px;}
/* 漂落花瓣 */
.petal{position:fixed; top:-6vh; font-size:15px; color:rgba(184,65,47,.4); animation:fall linear infinite; user-select:none;}
.petal:nth-child(1){left:8%; animation-duration:11s; animation-delay:0s}
.petal:nth-child(2){left:24%; animation-duration:14s; animation-delay:3s; font-size:11px}
.petal:nth-child(3){left:70%; animation-duration:12s; animation-delay:1.5s}
.petal:nth-child(4){left:88%; animation-duration:16s; animation-delay:5s; font-size:18px}
.petal:nth-child(5){left:52%; animation-duration:13s; animation-delay:7s; font-size:12px}
@keyframes fall{to{transform:translateY(108vh) rotate(340deg)}}

.page{max-width:880px; margin:0 auto; padding:7vh 48px 6vh; height:100vh; display:flex; flex-direction:column;}
.meta-row{display:flex; justify-content:space-between; align-items:baseline; font-family:"Cormorant Garamond",serif; font-style:italic; font-size:15px; letter-spacing:.14em; color:var(--ink-soft); border-bottom:1px solid var(--line); padding-bottom:14px;}
.meta-row .no{font-style:normal; letter-spacing:.3em}
h1{font-weight:900; font-size:clamp(34px,5.2vw,56px); letter-spacing:.08em; margin-top:5vh; line-height:1.25}
h1 .hand{font-family:"Ma Shan Zheng","STKaiti","KaiTi",cursive; font-weight:400; color:var(--seal); font-size:1.06em; margin-left:.18em}
.salut{font-family:"Ma Shan Zheng","STKaiti","KaiTi",cursive; font-size:clamp(26px,3.4vw,38px); color:var(--ink); margin:3.4vh 0 1.2vh}
.letter{font-size:clamp(15px,1.45vw,18.5px); line-height:2.15; color:var(--ink); text-align:justify; max-width:46em}
.letter p{margin-bottom:1.1em; text-indent:2em}
.letter p:first-of-type::first-letter{font-size:2.2em; float:left; line-height:1; padding:.04em .12em 0 0; color:var(--seal); font-weight:600}
/* 打字机段落 */
.type-cursor{display:inline-block; width:1px; height:1.05em; background:var(--seal); margin-left:2px; vertical-align:-0.12em; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.foot{margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid var(--line); padding-top:14px}
.foot .sign{font-family:"Ma Shan Zheng","STKaiti",cursive; font-size:26px}
.foot .date{font-family:"Cormorant Garamond",serif; font-style:italic; color:var(--ink-soft); letter-spacing:.2em; font-size:14px}
/* 火漆印 */
.seal{width:64px; height:64px; border-radius:50%; background:radial-gradient(circle at 34% 30%, #d0684f, var(--seal) 58%, #8f3222); color:#f8ead9; display:flex; align-items:center; justify-content:center; font-family:"Ma Shan Zheng",cursive; font-size:24px; box-shadow:0 3px 10px rgba(143,50,34,.35), inset 0 0 0 3px rgba(255,255,255,.18); transform:rotate(-8deg)}
/* 入场动效 */
.rise{opacity:0; transform:translateY(18px); animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1; transform:none}}
.r1{animation-delay:.1s}.r2{animation-delay:.3s}.r3{animation-delay:.55s}.r4{animation-delay:.8s}
</style>
</head>
<body>
<div class="petal">❀</div><div class="petal">❀</div><div class="petal">❀</div><div class="petal">❀</div><div class="petal">❀</div>
<main class="page">
  <div class="meta-row rise r1"><span>LETTERS · 写给你的信</span><span class="no">No. 001</span></div>
  <h1 class="rise r2">见字如面<span class="hand">，如晤</span></h1>
  <p class="salut rise r2">亲爱的宝贝：</p>
  <div class="letter rise r3">
    <p>此刻，我坐在窗边，阳光透过薄纱洒在纸上，暖暖的，就像你给我的感觉。提起笔，千言万语涌上心头，却又不知从何说起，只能将满心的欢喜和眷恋，都揉进这封信里，寄给你。</p>
    <p>认识你之前，我的世界是平淡的，像一幅未着色的画卷，虽有轮廓，却少了灵动的色彩。而你，就像一束光，突然闯进了我的生活，瞬间点亮了一切。</p>
  </div>
  <div class="foot rise r4">
    <div>
      <div class="sign">—— Tao</div>
      <div class="date">WRITTEN WITH ALL MY HEART · 2026</div>
    </div>
    <div class="seal">心</div>
  </div>
</main>
<script>
/* 打字机：第一段逐字浮现，增强"正在写信"的手作感 */
(function(){
  const p = document.querySelector('.letter p');
  const full = p.textContent; p.textContent = '';
  const cursor = document.createElement('span'); cursor.className='type-cursor'; p.appendChild(cursor);
  let i = 0; const t0 = performance.now(), delay = 1400;
  (function tick(now){
    const elapsed = now - t0;
    const target = Math.max(0, Math.floor((elapsed - delay) / 52));
    if (target > i){ i = Math.min(target, full.length); p.textContent = full.slice(0, i); p.appendChild(cursor); }
    if (i < full.length) requestAnimationFrame(tick); else cursor.remove();
  })(t0);
})();
</script>
</body>
</html>
